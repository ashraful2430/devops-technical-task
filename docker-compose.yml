version: '3.9'

x-app-defaults: &app-defaults
  build:
    context: .
    dockerfile: Dockerfile
    target: production
  restart: unless-stopped
  networks:
    - internal
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
    interval: 15s
    timeout: 5s
    start_period: 10s
    retries: 3

services:

  app1:
    <<: *app-defaults
    container_name: api-app1
    environment:
      PORT: 3000
      INSTANCE_ID: app1
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-1.0.0}

  app2:
    <<: *app-defaults
    container_name: api-app2
    environment:
      PORT: 3000
      INSTANCE_ID: app2
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-1.0.0}

  nginx:
    image: nginx:1.25-alpine
    container_name: api-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
    depends_on:
      - app1
      - app2

networks:
  internal:
    driver: bridge
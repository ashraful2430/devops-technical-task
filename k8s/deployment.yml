apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-api
  namespace: default
  labels:
    app: devops-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0    
      maxSurge: 1          
  template:
    metadata:
      labels:
        app: devops-api
    spec:
      containers:
        - name: api
          image: ashik6251/devops-api:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: devops-api-config
          env:
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name  
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: false
          tags: devops-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} bash << 'ENDSSH'
            set -e
            cd ~/devops-technical-task

            echo "Fetching secrets from AWS Secrets Manager..."
            ./scripts/fetch-secrets.sh

            echo "Pulling latest code..."
            git fetch origin main
            git pull origin main

            echo "Rolling update — app1..."
            docker compose up -d --no-deps --build app1
            sleep 15

            echo "Checking app1 health..."
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' api-app1)
            if [ "$STATUS" != "healthy" ]; then
              echo "app1 unhealthy — aborting"
              exit 1
            fi

            echo "Rolling update — app2..."
            docker compose up -d --no-deps --build app2
            sleep 15

            echo "Checking app2 health..."
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' api-app2)
            if [ "$STATUS" != "healthy" ]; then
              echo "app2 unhealthy — aborting"
              exit 1
            fi

            echo "Reloading Nginx..."
            docker compose exec nginx nginx -s reload

            echo "Deploy complete."
            docker compose ps
          ENDSSH

      - name: Smoke test
        run: |
          sleep 5
          curl -f http://${{ secrets.SERVER_IP }}/status
          echo "Smoke test passed."